<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quake 3D Arena</title>
    <style>
      :root {
        --bg: #070b12;
        --panel: rgba(13, 18, 27, 0.72);
        --border: rgba(146, 160, 191, 0.25);
        --text: #edf4ff;
        --muted: #aab8d3;
        --glow: #ff5d4d;
        --glow-2: #628dff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgba(67, 88, 139, 0.38), transparent 28%),
          linear-gradient(180deg, #05070c 0%, #090d15 48%, #04060a 100%);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      #viewport {
        display: block;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, #04070c 0%, #0b1018 46%, #05070d 100%);
      }

      .hud {
        position: fixed;
        left: 24px;
        top: 20px;
        padding: 18px 20px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.35);
        max-width: 320px;
        pointer-events: none;
      }

      .kicker {
        display: inline-block;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 3vw, 40px);
        line-height: 0.9;
        letter-spacing: -0.06em;
      }

      .status {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 16px var(--glow), 0 0 28px rgba(255, 93, 77, 0.8);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.8; }
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div class="hud">
      <div class="kicker">Arena 01</div>
      <h1>Quake<br />3D Arena</h1>
      <div class="status"><span class="dot"></span> Combat ready</div>
    </div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

      const canvas = document.getElementById('viewport');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05080d);
      scene.fog = new THREE.Fog(0x05080d, 18, 52);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 6.5, 18);

      const clock = new THREE.Clock();

      const ambient = new THREE.HemisphereLight(0x91a9ff, 0x160d0d, 1.3);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xfff2d9, 1.7);
      keyLight.position.set(12, 18, 8);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -30;
      keyLight.shadow.camera.right = 30;
      keyLight.shadow.camera.top = 30;
      keyLight.shadow.camera.bottom = -30;
      scene.add(keyLight);

      const redLight = new THREE.PointLight(0xff5d4d, 18, 30, 2.2);
      redLight.position.set(0, 3.5, 0);
      scene.add(redLight);

      const blueLight = new THREE.PointLight(0x6c8bff, 10, 25, 2);
      blueLight.position.set(0, 5, -10);
      scene.add(blueLight);

      function createArena() {
        const floorMaterial = new THREE.MeshStandardMaterial({
          color: 0x121921,
          roughness: 0.8,
          metalness: 0.46,
        });

        const outerFloor = new THREE.Mesh(new THREE.CylinderGeometry(18, 18, 1.1, 64), floorMaterial);
        outerFloor.receiveShadow = true;
        outerFloor.position.y = -1.2;
        scene.add(outerFloor);

        const innerFloor = new THREE.Mesh(
          new THREE.CylinderGeometry(11.2, 11.2, 0.65, 64),
          new THREE.MeshStandardMaterial({
            color: 0x1d2835,
            roughness: 0.65,
            metalness: 0.5,
            emissive: 0x10263d,
            emissiveIntensity: 0.4,
          })
        );
        innerFloor.position.y = 0.2;
        innerFloor.receiveShadow = true;
        scene.add(innerFloor);

        const ringMaterial = new THREE.MeshStandardMaterial({
          color: 0x2d3846,
          roughness: 0.5,
          metalness: 0.82,
          emissive: 0x2f3a47,
          emissiveIntensity: 0.4,
        });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(8.6, 0.56, 16, 128), ringMaterial);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.5;
        scene.add(ring);

        const core = new THREE.Mesh(
          new THREE.CylinderGeometry(1.8, 1.8, 1.2, 32),
          new THREE.MeshStandardMaterial({
            color: 0x1d1111,
            emissive: 0xff5d4d,
            emissiveIntensity: 2,
            roughness: 0.35,
            metalness: 0.7,
          })
        );
        core.position.y = 1.1;
        core.castShadow = true;
        scene.add(core);

        const centralGlow = new THREE.Mesh(
          new THREE.SphereGeometry(0.8, 24, 24),
          new THREE.MeshStandardMaterial({
            color: 0xff8e6d,
            emissive: 0xff5d4d,
            emissiveIntensity: 2.8,
            roughness: 0.18,
            metalness: 0.2,
          })
        );
        centralGlow.position.y = 1.5;
        scene.add(centralGlow);

        const wallMaterial = new THREE.MeshStandardMaterial({
          color: 0x202b39,
          roughness: 0.84,
          metalness: 0.62,
        });

        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const x = Math.cos(angle) * 15;
          const z = Math.sin(angle) * 15;

          const wall = new THREE.Mesh(new THREE.BoxGeometry(1.6, 4.8, 1.6), wallMaterial);
          wall.position.set(x, 2.1, z);
          wall.castShadow = true;
          wall.receiveShadow = true;
          scene.add(wall);

          const strip = new THREE.Mesh(
            new THREE.BoxGeometry(1.1, 0.4, 1.1),
            new THREE.MeshStandardMaterial({
              color: 0x4f6fff,
              emissive: 0x6b86ff,
              emissiveIntensity: 1.5,
            })
          );
          strip.position.set(x, 4.6, z);
          scene.add(strip);
        }

        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2 + Math.PI / 7;
          const x = Math.cos(angle) * 7.5;
          const z = Math.sin(angle) * 7.5;
          const crate = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 1.6, 1.6),
            new THREE.MeshStandardMaterial({
              color: 0x3b4656,
              roughness: 0.82,
              metalness: 0.4,
              emissive: 0x1d2c3d,
              emissiveIntensity: 0.4,
            })
          );
          crate.position.set(x, 0.9, z);
          crate.castShadow = true;
          crate.receiveShadow = true;
          scene.add(crate);
        }

        return { ring, core, centralGlow };
      }

      const arena = createArena();

      const drones = [];
      for (let i = 0; i < 7; i++) {
        const drone = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.5, 1),
          new THREE.MeshStandardMaterial({
            color: i % 2 === 0 ? 0xff6b57 : 0x7ca9ff,
            emissive: i % 2 === 0 ? 0xff5d4d : 0x5b7dff,
            emissiveIntensity: 1.7,
            metalness: 0.3,
            roughness: 0.25,
          })
        );
        drone.position.set(
          (Math.random() - 0.5) * 12,
          3 + Math.random() * 2.5,
          (Math.random() - 0.5) * 12
        );
        drone.userData = {
          angle: Math.random() * Math.PI * 2,
          radius: 4 + Math.random() * 3.5,
          height: 2.5 + Math.random() * 2,
          speed: 0.5 + Math.random() * 0.9,
          offset: Math.random() * Math.PI * 2,
        };
        scene.add(drone);
        drones.push(drone);
      }

      const skyRing = new THREE.Mesh(
        new THREE.TorusGeometry(15.5, 0.2, 12, 180),
        new THREE.MeshStandardMaterial({
          color: 0x4d6cff,
          emissive: 0x7aa0ff,
          emissiveIntensity: 1.2,
          transparent: true,
          opacity: 0.75,
        })
      );
      skyRing.rotation.x = Math.PI / 2;
      skyRing.position.y = 7.8;
      scene.add(skyRing);

      function animate() {
        const time = clock.getElapsedTime();
        const orbit = time * 0.4;

        camera.position.x = Math.sin(orbit) * 13.5;
        camera.position.z = Math.cos(orbit) * 13.5;
        camera.position.y = 5.4 + Math.sin(time * 0.8) * 0.8;
        camera.lookAt(0, 2.2, 0);

        arena.ring.rotation.z = time * 0.8;
        arena.core.rotation.y = time * 1.8;
        arena.centralGlow.scale.setScalar(1 + Math.sin(time * 3) * 0.12);
        redLight.intensity = 18 + Math.sin(time * 4) * 4;
        blueLight.intensity = 10 + Math.sin(time * 5.2 + 2) * 3;

        for (let i = 0; i < drones.length; i++) {
          const drone = drones[i];
          const d = drone.userData;
          const angle = time * d.speed + d.offset;
          drone.position.x = Math.cos(angle) * d.radius;
          drone.position.z = Math.sin(angle) * d.radius;
          drone.position.y = d.height + Math.sin(time * 2.2 + i) * 1.25;
          drone.rotation.x = angle * 1.6;
          drone.rotation.y = angle * 1.2;
        }

        skyRing.rotation.z = time * 0.28;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      });
    </script>
  </body>
</html>
