<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050a09">
<title>PlayGround</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308120f'/%3E%3Crect x='5' y='9' width='3' height='14' rx='1.5' fill='%237cffb2'/%3E%3Crect x='24' y='9' width='3' height='14' rx='1.5' fill='%235bd8ff'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23f2fff9'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    color: #e6fff6;
    background: radial-gradient(900px 600px at 50% -10%, #123028 0%, #07100d 52%, #050a09 100%);
  }
  main { width: min(92vw, 640px); }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(26px, 6vw, 40px);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-align: center;
  }
  .tagline {
    margin: 0 0 34px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #7e9c93;
  }
  .game {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 20px;
    border: 1px solid #1d3a33;
    border-radius: 16px;
    background: rgba(8, 18, 15, 0.72);
    color: inherit;
    text-decoration: none;
    transition: border-color 120ms ease, transform 120ms ease;
  }
  .game:hover, .game:focus-visible {
    border-color: #7cffb2;
    transform: translateY(-2px);
    outline: none;
  }
  .icon {
    position: relative;
    flex: 0 0 64px;
    height: 44px;
    border: 1px solid #2a4a42;
    border-radius: 8px;
    background: #07120f;
  }
  .icon::before, .icon::after {
    content: "";
    position: absolute;
    top: 10px;
    width: 4px;
    height: 24px;
    border-radius: 2px;
  }
  .icon::before { left: 9px; background: #7cffb2; box-shadow: 0 0 10px rgba(124,255,178,.7); }
  .icon::after { right: 9px; background: #5bd8ff; box-shadow: 0 0 10px rgba(91,216,255,.7); }
  .dot {
    position: absolute;
    top: 19px;
    left: 30px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f2fff9;
    box-shadow: 0 0 10px rgba(190,255,226,.9);
  }
  .meta h2 { margin: 0 0 4px; font-size: 16px; letter-spacing: 0.16em; }
  .meta p { margin: 0; font-size: 11px; line-height: 1.5; color: #7e9c93; letter-spacing: 0.06em; }
  .arrow { margin-left: auto; color: #7cffb2; font-size: 20px; }
  footer { margin-top: 26px; text-align: center; font-size: 10px; letter-spacing: 0.2em; color: #4d6b62; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <h1>PLAYGROUND</h1>
  <p class="tagline">tiny games, no installs</p>

  <a class="game" href="./default-version-test/">
    <span class="icon" aria-hidden="true"><span class="dot"></span></span>
    <span class="meta">
      <h2>PONG</h2>
      <p>First to 7. Arrows / W S, or drag on touch.</p>
    </span>
    <span class="arrow" aria-hidden="true">→</span>
  </a>

  <footer>1 game</footer>
</main>
</body>
</html>
