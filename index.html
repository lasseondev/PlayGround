<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10131e">
<title>TRIBES // SKYFALL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131e;color:#f2f5ee;font-family:'Barlow Condensed',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.grain{position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(110deg,rgba(11,15,26,.94),rgba(12,18,27,.66) 55%,rgba(12,18,27,.28));transition:opacity .25s}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(640px,90vw);padding:36px 42px;border-left:3px solid #c8f45b;background:linear-gradient(115deg,rgba(10,15,24,.94),rgba(10,15,24,.48));box-shadow:0 25px 80px #0007}.eyebrow{font:700 11px 'Space Mono',monospace;letter-spacing:.27em;color:#c8f45b}.title{font-size:clamp(68px,12vw,118px);font-weight:900;line-height:.78;letter-spacing:-.045em;margin:20px 0 18px}.title span{color:#c8f45b}.subtitle{max-width:430px;color:#bac2cc;font-size:17px;line-height:1.35;margin-bottom:26px}.start{border:0;background:#c8f45b;color:#10131e;padding:14px 28px;font:800 16px 'Barlow Condensed';letter-spacing:.16em;cursor:pointer}.start:hover{background:#e1ff88}.keys{display:flex;gap:24px;margin-top:26px;font:10px 'Space Mono',monospace;color:#8d98a3;line-height:1.8}.keys b{color:#eef2e7}.corner{position:fixed;left:24px;bottom:20px;color:#93a0a6;font:9px 'Space Mono',monospace;letter-spacing:.18em}.mobile-help{display:none}
@media(max-width:700px){.panel{padding:28px 25px}.keys{gap:12px;font-size:8px}.mobile-help{display:block}.corner{display:none}}
</style></head><body>
<canvas id="game"></canvas><div class="grain"></div>
<div class="overlay" id="overlay"><section class="panel"><div class="eyebrow">FRONTIER WARFARE // SIMULATION 07</div><h1 class="title">SKY<span>FALL</span></h1><p class="subtitle">The frontier is yours to take. Build speed on the slopes, launch into the sky, and make every shot count.</p><button class="start" id="start">DEPLOY TO THE FRONTIER&nbsp; ↗</button><div class="keys"><div><b>W A S D</b> MOVE<br><b>SPACE</b> JUMP / JET</div><div><b>MOUSE</b> AIM<br><b>CLICK</b> FIRE</div><div class="mobile-help"><b>TOUCH</b> MOVE + AIM</div></div></section></div><div class="corner">TRIBES // TRAINING GROUNDS &nbsp;·&nbsp; SECTOR 04</div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay');let w,h,dpr,playing=false,last=0,keys={},mouse={x:0,y:0,down:false},touchMove=null,touchAim=null,fireTimer=0,flash=0,kills=0,elapsed=0;const p={x:0,y:0,z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,hp:100,energy:100,ground:false};let bots=[],shots=[],particles=[];const arena=52;function resize(){dpr=Math.min(devicePixelRatio||1,1.7);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){Object.assign(p,{x:0,y:0,z:0,vx:0,vy:0,vz:0,yaw:0,pitch:0,hp:100,energy:100});kills=0;elapsed=0;shots=[];bots=[];for(let i=0;i<7;i++)bots.push({x:(Math.random()-.5)*74,z:(Math.random()-.5)*74,hp:100,phase:Math.random()*6.28,speed:2+Math.random()*1.3,fire:1+Math.random()*2});}
function start(){reset();playing=true;overlay.classList.add('hidden');if(c.requestPointerLock)c.requestPointerLock()}document.getElementById('start').onclick=start;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(e.code==='KeyR'&&playing){p.hp=100}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousemove',e=>{if(document.pointerLockElement===c){p.yaw-=e.movementX*.0022;p.pitch=Math.max(-.75,Math.min(.75,p.pitch+e.movementY*.002))}else if(playing&&touchAim){p.yaw-=(e.clientX-mouse.x)*.006;p.pitch=Math.max(-.7,Math.min(.7,p.pitch+(e.clientY-mouse.y)*.005))}mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('mousedown',e=>{if(e.button===0){mouse.down=true;if(playing)shoot()}});addEventListener('mouseup',()=>mouse.down=false);c.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.clientX<w*.48)touchMove={id:t.identifier,x:t.clientX,y:t.clientY,ox:t.clientX,oy:t.clientY};else touchAim={id:t.identifier,x:t.clientX,y:t.clientY,ox:t.clientX,oy:t.clientY};}},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){let q=[touchMove,touchAim].find(a=>a&&a.id===t.identifier);if(q){q.x=t.clientX;q.y=t.clientY;if(q===touchAim){p.yaw-=(q.x-q.ox)*.005;p.pitch=Math.max(-.7,Math.min(.7,p.pitch+(q.y-q.oy)*.004))}q.ox=q.x;q.oy=q.y}}},{passive:false});c.addEventListener('touchend',e=>{for(const t of e.changedTouches){if(touchAim&&touchAim.id===t.identifier){shoot();touchAim=null}if(touchMove&&touchMove.id===t.identifier)touchMove=null}});
function shoot(){if(!playing||fireTimer>0)return;fireTimer=.19;flash=.08;let target=null,best=.105;for(const b of bots){if(b.hp<=0)continue;let dx=b.x-p.x,dz=b.z-p.z,dist=Math.hypot(dx,dz),ang=Math.atan2(dx,dz)-p.yaw;ang=Math.atan2(Math.sin(ang),Math.cos(ang));let vert=Math.atan2(1.3-p.z*0+0.2,dist)-p.pitch;if(Math.abs(ang)<best&&Math.abs(vert)<.15&&dist<48){best=Math.abs(ang);target=b}}if(target){target.hp-=34;for(let i=0;i<7;i++)particles.push({x:target.x,y:1.4,z:target.z,life:.4,color:'#c8f45b'});if(target.hp<=0){kills++;target.respawn=3}}}
function project(x,y,z){let dx=x-p.x,dz=z-p.z,cs=Math.cos(p.yaw),sn=Math.sin(p.yaw),xx=dx*cs-dz*sn,zz=dx*sn+dz*cs;if(zz<.15)return null;let focal=h*.78,scale=focal/zz;return{x:w/2+xx*scale,y:h*.51-(y-1.65-p.y)*scale-p.pitch*focal,scale,z:zz}}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fill()}
function box(x,y,z,sx,sy,sz,color,top){let v=[[x-sx/2,y,z-sz/2],[x+sx/2,y,z-sz/2],[x+sx/2,y,z+sz/2],[x-sx/2,y,z+sz/2],[x-sx/2,y+sy,z-sz/2],[x+sx/2,y+sy,z-sz/2],[x+sx/2,y+sy,z+sz/2],[x-sx/2,y+sy,z+sz/2]].map(a=>project(...a));if(v.some(a=>!a))return;let faces=[[0,1,5,4,'#263341'],[1,2,6,5,'#34404b'],[2,3,7,6,'#202d38'],[4,5,6,7,top||color]];for(const f of faces)polygon(f.slice(0,4).map(i=>v[i]),f[4])}
function drawWorld(){let sky=ctx.createLinearGradient(0,0,0,h*.65);sky.addColorStop(0,'#182231');sky.addColorStop(.67,'#526d79');sky.addColorStop(1,'#e1a66c');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);let horizon=h*.51+p.pitch*h*.55;ctx.fillStyle='#d6a36d';ctx.beginPath();ctx.ellipse(w*.77,horizon-55,110,42,0,0,7);ctx.fill();polygon([{x:0,y:horizon+30},{x:w*.12,y:horizon-38},{x:w*.25,y:horizon+15},{x:w*.42,y:horizon-52},{x:w*.53,y:horizon+18},{x:w*.7,y:horizon-29},{x:w*.82,y:horizon+11},{x:w,y:horizon-54},{x:w,y:h},{x:0,y:h}], '#253c48');polygon([{x:0,y:horizon+60},{x:w*.2,y:horizon+5},{x:w*.39,y:horizon+74},{x:w*.58,y:horizon+3},{x:w*.8,y:horizon+55},{x:w,y:horizon+9},{x:w,y:h},{x:0,y:h}], '#334f55');let g=ctx.createLinearGradient(0,horizon,0,h);g.addColorStop(0,'#607359');g.addColorStop(1,'#202f32');ctx.fillStyle=g;ctx.fillRect(0,horizon,w,h);
// ground grid and runway
ctx.lineWidth=1;for(let z=4;z<arena*2;z+=4){let a=project(-arena,0,z),b=project(arena,0,z);if(a&&b){ctx.strokeStyle=z%16===4?'#a3ad7866':'#b1b89b22';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}for(let x=-arena;x<=arena;x+=8){let a=project(x,0,3),b=project(x,0,arena*2);if(a&&b){ctx.strokeStyle='#bdc29d24';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}let road=[[-9,5],[9,5],[9,95],[-9,95]].map(q=>project(q[0],.02,q[1]));if(road.every(Boolean)){polygon(road,'#34444a');for(let z=12;z<90;z+=10){let a=project(0,.05,z);if(a){ctx.fillStyle='#d4d1ad';ctx.fillRect(a.x-1,a.y-10*a.scale/30,2,20*a.scale/30)}}}
// perimeter towers + floating platforms
for(let i=-3;i<=3;i++){box(-18+i*6,0,29+Math.sin(i)*2,3,4,3,'#68735b','#a6a36a');box(18+i*6,0,47+Math.cos(i)*2,3,5,3,'#68735b','#aaa36b')}
for(const [x,z,sx,sz] of [[-12,20,8,7],[13,29,9,7],[-21,39,10,8],[21,54,11,8],[0,66,18,11],[-13,83,9,7],[16,93,9,7]])box(x,5,sx,sx,1,sz,'#627067','#c5b96e');for(const [x,z] of [[-26,24],[25,34],[-30,62],[30,77],[-7,47],[8,103]])box(x,0,z,3,8,3,'#465c61','#c8f45b');
let objs=[];for(const b of bots)if(b.hp>0)objs.push({z:Math.hypot(b.x-p.x,b.z-p.z),fn:()=>drawBot(b)});for(const s of shots)objs.push({z:Math.hypot(s.x-p.x,s.z-p.z),fn:()=>drawShot(s)});objs.sort((a,b)=>b.z-a.z);objs.forEach(o=>o.fn());drawGun()}
function drawBot(b){let bob=Math.sin(elapsed*5+b.phase)*.12,q=project(b.x,0,b.z);if(!q)return;let head=project(b.x,2.2+bob,b.z),torso=project(b.x,1.05+bob,b.z);if(!head||!torso)return;let r=Math.max(3,12*q.scale/80),body=Math.max(4,27*q.scale/80);ctx.fillStyle='#10192377';ctx.beginPath();ctx.ellipse(q.x,q.y,r*1.6,r*.5,0,0,7);ctx.fill();ctx.strokeStyle='#ed795e';ctx.lineWidth=Math.max(2,body*.2);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(torso.x,torso.y);ctx.stroke();ctx.fillStyle='#bf5548';ctx.fillRect(torso.x-body*.55,torso.y-body*.4,body*1.1,body*.9);ctx.fillStyle='#f4c18b';ctx.beginPath();ctx.arc(head.x,head.y,r,0,7);ctx.fill();ctx.fillStyle='#20252b';ctx.fillRect(head.x-r*.55,head.y-r*.1,r*1.1,r*.22);ctx.fillStyle='#f2f0d9';ctx.fillRect(q.x-body,q.y+7,body*2,3);ctx.fillStyle='#c8f45b';ctx.fillRect(q.x-body,q.y+7,body*2*Math.max(0,b.hp/100),3)}
function drawShot(s){let q=project(s.x,s.y,s.z);if(!q)return;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(2,4*q.scale/80),0,7);ctx.fill()}
function drawGun(){ctx.save();let kick=fireTimer>0?Math.sin(fireTimer*25)*5:0;ctx.translate(w*.79,h*.82+kick);ctx.fillStyle='#10171e';ctx.beginPath();ctx.moveTo(-55,80);ctx.lineTo(-38,-15);ctx.lineTo(4,-43);ctx.lineTo(61,-20);ctx.lineTo(73,80);ctx.fill();ctx.fillStyle='#48535a';ctx.beginPath();ctx.moveTo(-34,4);ctx.lineTo(-14,-36);ctx.lineTo(34,-30);ctx.lineTo(50,24);ctx.lineTo(-28,35);ctx.fill();ctx.fillStyle='#c8f45b';ctx.fillRect(-5,-31,25,4);ctx.fillStyle='#78847e';ctx.fillRect(10,-12,9,35);if(flash>0){ctx.fillStyle='#ffdf91';ctx.beginPath();ctx.moveTo(15,-46);ctx.lineTo(4,-71);ctx.lineTo(27,-59);ctx.lineTo(45,-76);ctx.lineTo(39,-45);ctx.fill()}ctx.restore()}
function hud(){ctx.save();ctx.font='700 12px "Space Mono",monospace';ctx.fillStyle='#e9eddf';ctx.fillText('FRONTIER / SECTOR 04',24,32);ctx.fillStyle='#a5b0aa';ctx.fillText('ELIMINATIONS',24,h-96);ctx.font='800 48px "Barlow Condensed"';ctx.fillStyle='#c8f45b';ctx.fillText(String(kills).padStart(2,'0'),23,h-49);ctx.font='700 11px "Space Mono"';ctx.fillStyle='#dbe1d5';ctx.fillText('VITALS',24,h-135);ctx.fillStyle='#15232b';ctx.fillRect(24,h-124,168,8);ctx.fillStyle=p.hp>30?'#c8f45b':'#f3725b';ctx.fillRect(24,h-124,168*p.hp/100,8);ctx.fillStyle='#dbe1d5';ctx.fillText('JETPACK',24,h-160);ctx.fillStyle='#15232b';ctx.fillRect(24,h-149,168,5);ctx.fillStyle='#76d7e2';ctx.fillRect(24,h-149,168*p.energy/100,5);
// compass and minimap
ctx.textAlign='center';ctx.font='700 11px "Space Mono"';ctx.fillStyle='#eef0e5';ctx.fillText(['N','NE','E','SE','S','SW','W','NW'][Math.round(((p.yaw%(Math.PI*2)+Math.PI*2)%(Math.PI*2))/(Math.PI/4))%8],w/2,31);ctx.textAlign='right';ctx.font='700 12px "Space Mono"';ctx.fillText('TIME  '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0'),w-24,32);let mx=w-102,my=110;ctx.globalAlpha=.8;ctx.fillStyle='#111923';ctx.fillRect(mx-63,my-63,126,126);ctx.strokeStyle='#c8f45b66';ctx.strokeRect(mx-63,my-63,126,126);ctx.fillStyle='#c8f45b';ctx.beginPath();ctx.arc(mx+p.x*1.2,my+p.z*1.2,3,0,7);ctx.fill();ctx.strokeStyle='#c8f45b';ctx.beginPath();ctx.moveTo(mx+p.x*1.2,my+p.z*1.2);ctx.lineTo(mx+p.x*1.2+Math.sin(p.yaw)*10,my+p.z*1.2+Math.cos(p.yaw)*10);ctx.stroke();for(const b of bots)if(b.hp>0){ctx.fillStyle='#ed795e';ctx.fillRect(mx+b.x*1.2-2,my+b.z*1.2-2,4,4)}ctx.globalAlpha=1;
// crosshair
ctx.strokeStyle='#f4f4e9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(w/2-13,h/2);ctx.lineTo(w/2-5,h/2);ctx.moveTo(w/2+5,h/2);ctx.lineTo(w/2+13,h/2);ctx.moveTo(w/2,h/2-13);ctx.lineTo(w/2,h/2-5);ctx.moveTo(w/2,h/2+5);ctx.lineTo(w/2,h/2+13);ctx.stroke();if(flash>0){ctx.fillStyle='#ffe3aa';ctx.beginPath();ctx.arc(w/2,h/2,2,0,7);ctx.fill()}if(p.hp<=0){ctx.fillStyle='#d94b3c';ctx.font='800 52px "Barlow Condensed"';ctx.textAlign='center';ctx.fillText('SYSTEM FAILURE',w/2,h/2-25);ctx.font='14px "Space Mono"';ctx.fillStyle='#fff';ctx.fillText('PRESS R TO REBOOT',w/2,h/2+10)}ctx.restore()}
function update(dt){elapsed+=dt;fireTimer=Math.max(0,fireTimer-dt);flash=Math.max(0,flash-dt);let f=Number(keys.KeyW||keys.ArrowUp)-Number(keys.KeyS||keys.ArrowDown),side=Number(keys.KeyD||keys.ArrowRight)-Number(keys.KeyA||keys.ArrowLeft);if(touchMove){f=-Math.max(-1,Math.min(1,(touchMove.y-touchMove.oy)/45));side=Math.max(-1,Math.min(1,(touchMove.x-touchMove.ox)/45));if(Math.abs(f)+Math.abs(side)<.1){f=-Math.max(-1,Math.min(1,(touchMove.y-touchMove.oy)/45));side=Math.max(-1,Math.min(1,(touchMove.x-touchMove.ox)/45))}}let speed=Math.hypot(p.vx,p.vz),accel=(p.ground?19:7);p.vx+=(Math.sin(p.yaw)*f+Math.cos(p.yaw)*side)*accel*dt;p.vz+=(Math.cos(p.yaw)*f-Math.sin(p.yaw)*side)*accel*dt;let drag=p.ground?.982:.997;p.vx*=Math.pow(drag,dt*60);p.vz*=Math.pow(drag,dt*60);let max=keys.ShiftLeft||keys.ShiftRight?24:16;if(Math.hypot(p.vx,p.vz)>max){let s=max/Math.hypot(p.vx,p.vz);p.vx*=s;p.vz*=s}p.x+=p.vx*dt;p.z+=p.vz*dt;if(p.x>arena)p.x=arena;if(p.x< -arena)p.x=-arena;if(p.z>arena*2)p.z=arena*2;if(p.z< -12)p.z=-12;
if((keys.Space||keys.KeyE)&&p.energy>0){p.vy+=14*dt;p.energy=Math.max(0,p.energy-28*dt);p.ground=false}else p.energy=Math.min(100,p.energy+12*dt);if(keys.Space&&p.ground){p.vy=8;p.ground=false}p.vy-=18*dt;p.z+=0; // gravity
if(p.vy<0&&p.z<0)p.z=0; // stable arena coordinate
if(p.vy<0&&p.y<=0){p.y=0;p.vy=0;p.ground=true}else{p.y+=p.vy*dt;p.ground=false}if(p.y<0){p.y=0;p.vy=0;p.ground=true}if(p.ground&&p.vy===0&&keys.Space){p.vy=8;p.ground=false}
for(const b of bots){if(b.hp<=0){b.respawn-=dt;if(b.respawn<=0){b.x=(Math.random()-.5)*70;b.z=(Math.random()-.5)*75;b.hp=100;b.fire=1+Math.random()*2}continue}let dx=p.x-b.x,dz=p.z-b.z,dist=Math.hypot(dx,dz)||1;b.phase+=dt;b.x+=dx/dist*b.speed*dt;b.z+=dz/dist*b.speed*dt;b.fire-=dt;if(b.fire<=0&&dist<30){b.fire=1.3+Math.random()*1.8;if(Math.random()<.62){p.hp-=8;if(p.hp<=0)p.hp=0}}}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.life-=dt}shots=shots.filter(s=>s.life>0);particles=particles.filter(q=>{q.life-=dt;return q.life>0});if(mouse.down)shoot()}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;if(playing){if(p.hp>0)update(dt);drawWorld();hud()}else{p.yaw+=dt*.08;drawWorld();hud()}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();
</script></body></html>
