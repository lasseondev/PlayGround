<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pairing Smoke Test — Paddle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Crect x='8' y='20' width='16' height='4' rx='2' fill='%235eead4'/%3E%3Ccircle cx='16' cy='12' r='3' fill='%23ecfeff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Pairing smoke test</p>
        <h1>Paddle</h1>
      </div>
      <p class="tagline">Clear the wall.<br>Keep the ball alive.</p>
    </header>

    <div class="screen">
      <canvas id="game" width="720" height="480" aria-label="Paddle game. Use the left and right arrow keys to move, and Space to launch the ball."></canvas>
    </div>

    <div class="controls" aria-label="Controls">
      <span><kbd>←</kbd><kbd>→</kbd> move</span>
      <span><kbd>Space</kbd> launch</span>
      <span><kbd>P</kbd> pause</span>
      <span><kbd>R</kbd> restart</span>
    </div>

    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <script src="game.js"></script>
</body>
</html>
