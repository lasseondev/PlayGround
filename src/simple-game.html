<!DOCTYPE html>
<html>
<head>
    <title>3D RTS Warcraft Style Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            overflow: hidden;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            margin: 10px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #357abd;
        }
        .race-select {
            margin: 20px;
        }
        .race-btn {
            display: block;
            width: 200px;
            margin: 10px auto;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="mainMenu" class="menu">
        <h1>WARCRAFT 3D RTS</h1>
        <p>Select your race:</p>
        <div class="race-select">
            <button class="race-btn" onclick="startGame('human')">HUMAN EMPIRE</button>
            <button class="race-btn" onclick="startGame('nightElf')">NIGHT ELF ALLIANCE</button>
            <button class="race-btn" onclick="startGame('orc')">ORC HORDE</button>
        </div>
    </div>
    
    <div id="gameUI" class="menu" style="display: none;">
        <h2 id="gameTitle">Game Started!</h2>
        <p>Game is running... (Basic implementation)</p>
        <button onclick="alert('Game paused - implementing full features')">Pause</button>
        <button onclick="restartGame()">Restart</button>
    </div>

    <script>
        let scene, camera, renderer;
        let gameState = 'menu';
        let selectedRace = null;
        
        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 20);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 20, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100, 10, 10);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Simple axis helper
            const axesHelper = new THREE.AxesHelper(10);
            scene.add(axesHelper);
            
            // Start game after a short delay
            setTimeout(() => {
                startGameLoop();
                showGameUI();
            }, 1000);
        }
        
        function startGame(race) {
            selectedRace = race;
            document.getElementById('mainMenu').style.display = 'none';
            gameState = 'playing';
            
            console.log(`Starting game with race: ${race}`);
            
            // Initialize Three.js if not already done
            if (!scene) {
                initThree();
            } else {
                showGameUI();
                startGameLoop();
            }
        }
        
        function showGameUI() {
            document.getElementById('gameUI').style.display = 'block';
            document.getElementById('gameUI').className = 'menu';
            document.getElementById('gameTitle').textContent = `Playing as ${selectedRace.toUpperCase()}!`;
        }
        
        function restartGame() {
            document.getElementById('gameUI').style.display = 'none';
            selectedRace = null;
            gameState = 'menu';
            document.getElementById('mainMenu').style.display = 'block';
        }
        
        function startGameLoop() {
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Simple animation
            if (gameState === 'playing') {
                // Rotate the axes helper for visual interest
                scene.children.forEach(child => {
                    if (child.type === 'AxesHelper') {
                        child.rotation.y += 0.01;
                    }
                });
            }
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize Three.js when page loads
        if (typeof THREE !== 'undefined') {
            initThree();
        } else {
            // Wait for Three.js to load
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
            script.onload = function() {
                initThree();
            };
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
