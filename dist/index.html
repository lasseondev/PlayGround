            <span id="hud-level" class="chip-number">1</span>
          </div>
        </div>

        <div class="score-box" aria-live="polite">
          <span class="score-label">SCORE</span>
          <span id="hud-score" class="score-value">0</span>
        </div>

        <div class="hud-right">
          <div id="hud-birds" class="bird-count" aria-label="Birds remaining"></div>

            </svg>
          </button>
        </div>
      </header>

      <div id="ability-hint" class="ability-hint hidden" aria-live="polite">
        <span class="tap-ring"></span>
        <span id="ability-text">TAP FOR ABILITY</span>
      </div>

      <section id="screen-title" class="screen title-screen">
        <div class="title-scrim" aria-hidden="true"></div>

            <span class="logo-line logo-birds">BIRDS</span>
          </h1>
          <p class="tagline">Slingbird Saga</p>
          <p class="tagline-sub">Fling. Smash. Pop every pig.</p>

          <div class="title-actions">
            <button id="btn-play" class="btn btn-play" aria-label="Play">
              <span>PLAY</span>
              <small>Adventure</small>
            </button>
            <button id="btn-levels" class="btn btn-ghost">LEVELS</button>

        </div>
        <div class="rotate-hint">Turn your device for a wider view</div>

      <section id="screen-levels" class="screen levels-screen hidden">
        <div class="levels-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">THE FLOCK AWAITS</p>
              <h2>CHOOSE A LEVEL</h2>
